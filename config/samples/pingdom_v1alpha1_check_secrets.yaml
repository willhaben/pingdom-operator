# A Check that takes credentials from Secrets in its own namespace. Replace the placeholder values.
# Changing a Secret re-syncs the Check to Pingdom, so a rotated token needs no edit to the Check.
apiVersion: v1
kind: Secret
metadata:
  name: check-secrets-sample-auth
type: Opaque
stringData:
  username: change-me
  password: change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: check-secrets-sample-headers
type: Opaque
stringData:
  # key = header name, value = header value
  Authorization: Bearer change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: check-secrets-sample-url
type: Opaque
stringData:
  # key = urlTmpl variable
  apiKey: change-me
---
apiVersion: pingdom.willhaben.at/v1alpha1
kind: Check
metadata:
  labels:
    app.kubernetes.io/name: pingdom-operator
    app.kubernetes.io/managed-by: kustomize
  name: check-secrets-sample
spec:
  host: www.example.com
  type: http
  encryption: true
  port: 443
  paused: true
  # Basic auth for the target, from the keys "username" and "password"
  authSecretRef:
    name: check-secrets-sample-auth
  # Added to requestHeaders; a Secret key wins over a plain header of the same name
  requestHeaders:
    - "X-Client:pingdom-operator"
  requestHeadersSecretRef:
    name: check-secrets-sample-headers
  # Mutually exclusive with url. Variables are the keys of urlTmplSecretRef
  urlTmpl: "/status?key={{ .apiKey | urlquery }}"
  urlTmplSecretRef:
    name: check-secrets-sample-url
  tags:
    - managed-by-operator
