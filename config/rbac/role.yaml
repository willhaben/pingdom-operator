---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - pingdom.willhaben.at
  resources:
  - checks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - pingdom.willhaben.at
  resources:
  - checks/finalizers
  verbs:
  - update
- apiGroups:
  - pingdom.willhaben.at
  resources:
  - checks/status
  verbs:
  - get
  - patch
  - update
