# This rule is not used by the project pingdom-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over pingdom.willhaben.at.willhaben.at.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: pingdom-operator
    app.kubernetes.io/managed-by: kustomize
  name: check-admin-role
rules:
- apiGroups:
  - pingdom.willhaben.at.willhaben.at
  resources:
  - checks
  verbs:
  - '*'
- apiGroups:
  - pingdom.willhaben.at.willhaben.at
  resources:
  - checks/status
  verbs:
  - get
